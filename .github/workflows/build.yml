# ============================================
# restore-studio-pub 仓库 .github/workflows/build.yml (v0.3.0+, Nuitka 双平台)
# 触发: 私有仓库打 v* tag → build-trigger.yml 以 repository_dispatch 通知本仓库;
#       或手动 workflow_dispatch 传 tag
# 依赖 secret: PRIVATE_PULL_TOKEN (拉取私有仓库 ceoifung/restore-studio 的 token)
# 产物: RestoreStudio-windows-cuda.zip / RestoreStudio-linux-cuda.tar.gz → 挂到 Release
# 用时: 每平台约 60-150 分钟 (Nuitka 全量编译 + CUDA torch 下载)
# ============================================
name: Build Release

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（如 v0.3.0）'
        required: true
        default: 'v0.3.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RestoreStudio-windows-cuda
          # ubuntu-22.04 而非 latest: 旧 glibc(2.35) 保证产物在 Debian11+/Ubuntu22.04+ 可运行
          - os: ubuntu-22.04
            artifact: RestoreStudio-linux-cuda
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: 解析版本
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "构建版本: $TAG"

      - name: 拉取私有仓库源码(含 lada 子模块)
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_PULL_TOKEN }}
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$TAG" \
            "https://x-access-token:${TOKEN}@github.com/ceoifung/restore-studio.git" app
          cd app && git log --oneline -1 && ls lada/lada | head -3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Windows runner C 盘仅 ~14GB, CUDA torch+产物会占满; 缓存与临时目录放 D 盘
      - name: 磁盘腾挪 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "PIP_CACHE_DIR=D:\\pipcache" >> $GITHUB_ENV
          echo "TEMP=D:\\tmp" >> $GITHUB_ENV
          echo "TMP=D:\\tmp" >> $GITHUB_ENV
          mkdir -p /d/pipcache /d/tmp

      - name: 图形运行库 (Linux — PySide6 导入需 libEGL, headless runner 默认没有)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0

      - name: 安装 clang (Windows — MSVC cl 编译 sympy 巨型 C 文件会 C1002 爆堆)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y llvm --no-progress

      - name: 构建 (Windows, Nuitka CUDA)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: app
        run: pwsh -NoProfile -File scripts/build_nuitka.ps1

      - name: 构建 (Linux, Nuitka CUDA)
        if: runner.os == 'Linux'
        working-directory: app
        run: bash scripts/build_linux_nuitka.sh

      - name: 压缩产物
        shell: bash
        working-directory: app/build-nuitka
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "${{ matrix.artifact }}.zip" desktop_app.dist
          else
            tar -I "gzip -1" -cf "${{ matrix.artifact }}.tar.gz" desktop_app.dist
          fi
          ls -lh

      - name: 上传构建产物 (保险: Release 步骤失败时可直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/build-nuitka/RestoreStudio-*
          compression-level: 0
          retention-days: 14

      - name: 附到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: app/build-nuitka
        run: |
          FILE="${{ matrix.artifact }}.$([ "$RUNNER_OS" = "Windows" ] && echo zip || echo tar.gz)"
          gh release view "$TAG" -R ceoifung/restore-studio-pub >/dev/null 2>&1 || gh release create "$TAG" -R ceoifung/restore-studio-pub --generate-notes --title "$TAG"
          gh release upload "$TAG" "$FILE" -R ceoifung/restore-studio-pub --clobber
