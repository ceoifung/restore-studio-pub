name: Build Release

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（如 v0.2.0）'
        required: true
        default: 'v0.2.0'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 解析版本
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "构建版本: $TAG (VERSION=$VERSION)"

      - name: 拉取私有仓库源码(含子模块)
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_PULL_TOKEN }}
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$TAG" \
            "https://x-access-token:${TOKEN}@github.com/ceoifung/restore-studio.git" app
          cd app && git log --oneline -1 && ls lada | head -5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        shell: bash
        working-directory: app
        run: |
          python -m pip install -U pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "PySide6==6.9.1" opencv-python "av>=16.1" \
            "ultralytics==8.4.4" "mmengine==0.10.7" \
            tqdm wcwidth pyyaml requests pillow pyinstaller
          pip install --no-deps ./lada

      - name: 下载 Lada 预训练模型
        shell: bash
        working-directory: app
        run: |
          mkdir -p lada/model_weights
          for f in lada_mosaic_detection_model_v4_fast.pt \
                   lada_mosaic_detection_model_v4_accurate.pt \
                   lada_mosaic_detection_model_v2.pt \
                   lada_mosaic_restoration_model_generic_v1.2.pth; do
            curl -fL --retry 3 -o "lada/model_weights/$f" \
              "https://huggingface.co/ladaapp/lada/resolve/main/$f"
          done
          ls -la lada/model_weights

      - name: 下载 ffmpeg
        shell: bash
        working-directory: app
        run: |
          curl -fL --retry 3 -o ffmpeg.zip \
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          7z x ffmpeg.zip -offmpeg_tmp -y > /dev/null
          mkdir -p pkg/ffmpeg/bin
          cp ffmpeg_tmp/ffmpeg-*/bin/ffmpeg.exe ffmpeg_tmp/ffmpeg-*/bin/ffprobe.exe pkg/ffmpeg/bin/
          rm -rf ffmpeg.zip ffmpeg_tmp

      - name: 构建 exe
        shell: bash
        working-directory: app
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m PyInstaller --noconfirm --windowed \
            --name "RestoreStudio" --icon=launcher/app.ico \
            --collect-all lada --collect-all ultralytics --collect-all mmengine \
            --paths=. desktop_app.py

      - name: 组装完整包并压缩
        shell: bash
        working-directory: app
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mv dist/RestoreStudio "pkg/映真RestoreStudio"
          mkdir -p "pkg/映真RestoreStudio/lada"
          cp -r lada/model_weights "pkg/映真RestoreStudio/lada/model_weights"
          printf '%s\n' \
            "映真 Restore Studio — 视频去马赛克" \
            "======================================" \
            "1. 双击 RestoreStudio.exe" \
            "2. 拖入视频 → 开始处理; 或用左栏「批量后台处理」多视频排队" \
            "3. 成品默认在 results 目录; 批量模式存到源视频旁边(xxx_去马赛克.mp4)" \
            "" \
            "本构建为 CPU 版(无需独立显卡, 速度较慢); 有 NVIDIA 显卡可从源码部署 GPU 版。" \
            "基于开源项目 Lada(AGPL-3.0) 等构建。" \
            > "pkg/映真RestoreStudio/使用说明.txt"
          cd pkg && 7z a -tzip "restore-studio-${{ env.VERSION }}-win64.zip" "映真RestoreStudio" && ls -la *.zip

      - name: 创建 Release 并上传
        shell: bash
        working-directory: app/pkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="映真 Restore Studio ${{ env.VERSION }} — 自动构建(CPU版, 解压即用)。基于 Lada(AGPL-3.0)。源码私有, 问题反馈请到 Issues。"
          gh release create "$TAG" --repo ceoifung/restore-studio-pub \
            --title "映真 RestoreStudio $TAG" \
            --notes "$NOTES" \
            --target main \
            "restore-studio-${{ env.VERSION }}-win64.zip"
